<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdminYAAA · Gestión interna</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<div class="login-screen">
  <div class="login-card">
    <div class="login-logo">Admin<span>YAAA</span> · Gestión</div>
    <div class="login-sub">Uso interno — equipo AdminYAAA</div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
    </form>

    <div class="login-demo">
      <p>Acceso de demostración</p>
      <div class="demo-btn-row">
        <button class="btn btn-secondary demo-btn" data-email="joaquin@adminya.com.ar">Admin (Joaquín)</button>
        <button class="btn btn-secondary demo-btn" data-email="ana@adminya.com.ar">Operador (Ana)</button>
      </div>
    </div>
  </div>
</div>
<script src="/assets/js/auth.js"></script>
</body>
</html>
