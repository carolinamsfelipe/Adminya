<meta name="robots" content="noindex, nofollow">

</head>
<body class="app-body">

  <symbol id="i-bar" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 12h4l2 3h4l2-3h4"/><path d="M5.5 5h13L21 12v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6L5.5 5Z"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2 8 6-16 2 8h4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.9 3.4-7 7.5-7s7.5 3.1 7.5 7"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.8.8 3 2.7 3 5.6"/></symbol>
  <symbol id="i-check-sq" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7.5 12.5l2.5 2.5 6-6"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M4 4h16v12l-5 5H4z"/><path d="M15 21v-5h5"/></symbol>
  <symbol id="i-user-cog" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.2"/><path d="M3.5 20c0-3.4 2.9-6 6.5-6"/><circle cx="18" cy="17" r="2.4"/><path d="M18 13.2v.8M18 19.8v.8M21.2 17h-.8M15.6 17h-.8M20.3 14.7l-.6.6M15.9 18.9l-.6.6M20.3 19.3l-.6-.6M15.9 15.1l-.6-.6"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V7"/><path d="M7 12l5-5 5 5"/><path d="M4 20h16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.5 18a1.5 1.5 0 0 0 1.3 2.2h16.4a1.5 1.5 0 0 0 1.3-2.2L13.7 3.9a1.5 1.5 0 0 0-2.6 0Z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>

  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/></symbol>

</svg>

<div class="shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/img/adminyaaa-logo-dark.png" alt="AdminYAAA">
    </div>
    <div class="sidebar-role-tag" id="sidebar-role-tag">Panel cliente</div>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar-foot">
      <p class="sidebar-demo-note">Entorno de demostración. Los datos que ves son ficticios.</p>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="btn-icon topbar-menu-btn" id="menu-toggle" aria-label="Abrir menú"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
      <div class="topbar-search">
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="global-search" placeholder="Buscar clientes, solicitudes, documentos…" autocomplete="off">
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="btn-icon notif-btn" id="notif-btn" aria-label="Notificaciones"><svg class="i" aria-hidden="true"><use href="#i-bell"/></svg><span class="notif-dot"></span></button>
        <div class="demo-switch">
          <button class="demo-switch-btn" id="user-menu-btn">
            <span class="demo-switch-avatar" id="user-menu-avatar">–</span>
            <span id="user-menu-name">…</span>
            <svg class="i i--sm" aria-hidden="true"><use href="#i-chevron-down"/></svg>
          </button>
          <div class="dropdown-panel" id="user-menu-panel">
            <div class="dropdown-label">Cambiar a usuario de demostración</div>
            <div id="user-menu-list"></div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" id="reset-demo-btn"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>Restablecer datos de demo</button>
            <button class="dropdown-item" id="logout-btn"><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg>Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="assets/js/data.js?v=2"></script>
<script src="assets/js/app.js?v=2"></script>
</body>
</html>
